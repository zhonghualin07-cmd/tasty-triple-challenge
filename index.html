<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#6f2b18">
  <meta name="description" content="Tasty Triple Challenge — a two-course daily food matching challenge.">
  <title>Tasty Triple Challenge</title>
  <style>:root{color-scheme:dark;--ink:#fffaf2;--muted:#f0cdbd;--purple:#e85d3f;--pink:#ff9f43;--cyan:#ffd166;--panel:rgba(91,37,24,.9);--edge:rgba(255,245,222,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#35140e;color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overflow-x:hidden}
body{min-height:100dvh;background:radial-gradient(circle at 50% -10%,#b34a2e 0,#74301f 31%,#3a1711 68%,#23100d 100%)}
body.platform-paused #app{pointer-events:none}
body.platform-paused *{animation-play-state:paused!important}
#confetti{position:fixed;inset:0;pointer-events:none;opacity:.52;background-image:radial-gradient(ellipse,#ffd166 0 2px,transparent 2.5px),radial-gradient(ellipse,#ff8b64 0 2px,transparent 2.6px),radial-gradient(circle,#fff0c7 0 1px,transparent 1.7px);background-size:57px 61px,89px 77px,41px 43px;background-position:8px 14px,31px 2px,18px 30px;animation:drift 32s linear infinite}
@keyframes drift{to{background-position:122px 75px,120px 79px,100px 73px}}
button,select{font:inherit}button{border:0;color:#fff;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #fff8db;outline-offset:3px}
#app{position:relative;width:min(100%,480px);min-height:100dvh;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;height:48px;position:relative;z-index:5}.logo-mini{font-weight:900;letter-spacing:.04em}.icon-button{width:42px;height:42px;border-radius:14px;background:rgba(255,245,222,.1);border:1px solid var(--edge);font-size:20px}.pill{padding:8px 13px;border-radius:999px;background:rgba(255,245,222,.09);border:1px solid var(--edge);font-size:12px;color:var(--muted)}
.home{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;align-items:center;text-align:center}.food-hero{position:relative;width:190px;height:152px;margin:34px auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:5px;background:radial-gradient(ellipse at 50% 38%,#fffdf7 0 48%,#f5d4a6 50% 58%,#b76b3d 60% 64%,transparent 66%);filter:drop-shadow(0 22px 26px rgba(35,10,3,.45));animation:float 4s ease-in-out infinite}.food-hero span{font-size:54px;filter:drop-shadow(0 7px 5px rgba(80,25,10,.3));transform:translateY(-4px)}.food-hero span:nth-child(2){font-size:48px;transform:translateY(10px) rotate(-5deg)}.food-hero span:nth-child(3){font-size:46px;transform:translateY(-8px) rotate(5deg)}@keyframes float{50%{transform:translateY(-8px) rotate(1deg)}}
.eyebrow{margin:22px 0 8px;color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.title{margin:0;max-width:420px;font-size:clamp(38px,11vw,58px);line-height:.92;letter-spacing:-.055em}.title span{display:block;background:linear-gradient(100deg,#fff7dc,#ffd166 45%,#ff9f43);background-clip:text;color:transparent}.subtitle{max-width:330px;color:var(--muted);line-height:1.55;margin:18px auto 24px}.primary{width:100%;min-height:58px;border-radius:18px;padding:14px 22px;background:linear-gradient(110deg,#d9482b,#f07936 48%,#ffb347);font-weight:900;font-size:17px;box-shadow:0 14px 30px rgba(100,25,8,.36);transition:.2s transform}.primary:active{transform:scale(.97)}.secondary{width:100%;min-height:50px;border-radius:16px;background:rgba(255,245,220,.09);border:1px solid var(--edge);font-weight:750}.actions{display:grid;gap:12px;width:100%;margin-top:auto}.fineprint{font-size:11px;color:#c28e79;margin:14px 0 0}
.game-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}.game-header h1{font-size:17px;margin:0}.game-header p{font-size:11px;color:var(--muted);margin:3px 0}.right{text-align:right}.left{text-align:left}

.tray-wrap{position:relative;z-index:10}.tray{height:66px;padding:6px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;border-radius:19px;background:rgba(45,13,7,.86);border:1px solid rgba(255,237,202,.2);box-shadow:inset 0 0 22px rgba(0,0,0,.42)}.slot{display:grid;place-items:center;border-radius:12px;border:1px dashed rgba(255,236,204,.17);background:rgba(255,244,222,.04)}.slot .plate{width:72%}.slot .food-icon{font-size:25px}.powerbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}.power{min-height:56px;border-radius:14px;background:rgba(255,244,222,.08);border:1px solid var(--edge);font-size:10px;font-weight:750}.power b{display:block;font-size:17px;margin-bottom:2px}.power small{display:block;margin-top:2px;color:#ffd88a;font-size:8px;font-weight:850}.power:disabled{opacity:.35;cursor:not-allowed}
.overlay{position:fixed;z-index:100;inset:0;background:rgba(35,10,5,.74);display:grid;place-items:end center;padding:16px;backdrop-filter:blur(8px)}.modal{width:min(100%,440px);padding:26px 22px;border:1px solid rgba(255,238,209,.22);border-radius:28px;background:linear-gradient(160deg,#8b3c27,#4b1d15);box-shadow:0 30px 90px #210702;text-align:center}.modal h2{font-size:29px;margin:4px 0 8px}.modal p{color:var(--muted);line-height:1.5}.modal-actions{display:grid;gap:10px;margin-top:20px}.result-orb{width:84px;height:84px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:40px;background:linear-gradient(145deg,#fff8dc,#ffd166 50%,#f07a35);box-shadow:0 0 38px rgba(255,177,71,.55)}.settings-grid{display:grid;gap:14px;text-align:left;margin:20px 0}.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px;border-radius:14px;background:rgba(255,247,225,.07)}select{background:#4b1d15;color:white;border:1px solid var(--edge);padding:8px;border-radius:10px}
.toast{position:fixed;z-index:200;left:50%;bottom:120px;transform:translateX(-50%);background:#fff8e8;color:#4b1d15;padding:11px 16px;border-radius:999px;font-weight:800;box-shadow:0 10px 40px #210702;animation:toast 2.3s both}@keyframes toast{0%,100%{opacity:0;transform:translate(-50%,15px)}12%,85%{opacity:1;transform:translate(-50%,0)}}
@media(max-height:700px){.food-hero{width:145px;height:112px;margin-top:8px}.food-hero span{font-size:40px}.title{font-size:38px}.subtitle{margin:12px auto}.board-shell{height:355px}.tile{transform:scale(.88);transform-origin:top left}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
